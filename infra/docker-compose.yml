services:
  fastapi:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: fastapi-app
    env_file:
      - ../.env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=test2025*7
      - MAX_RETRIES=30
      - RETRY_INTERVAL=2
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
      - minio
    volumes:
      - ../src:/app/src
      - ../main.py:/app/main.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  neo4j:
    image: neo4j:5.19
    container_name: neo4j-db
    environment:
      - NEO4J_AUTH=neo4j/test2025*7
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "--username", "neo4j", "--password", "test2025*7", "--format", "plain", "--database", "neo4j", "RETURN 1;"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  minio:
    image: minio/minio:latest
    container_name: minio-server
    environment:
      - MINIO_ROOT_USER=adminminio2025
      - MINIO_ROOT_PASSWORD=SuperSecretKey2025
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
volumes:
  neo4j_data:
  minio_data:
